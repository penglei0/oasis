<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tc-placement-title tc-placement-desc" id="tc-a-to-b-best-placement-root">
        <title id="tc-placement-title">A 到 B 收发模式下 bw、latency、loss 的最佳配置点位</title>
        <desc id="tc-placement-desc">展示 A 到 B 发送方向的数据流路径，并用垂直指示箭头标明 bw 最佳配置点位于发送端 A 的 eth0 egress TBF，latency 与 loss 最佳配置点位于接收端 B 经 ingress 重定向后的 ifb0 NetEm。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #tc-a-to-b-best-placement-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #tc-a-to-b-best-placement-root { font-family: var(--font-sans); color: var(--color-ink); }
      #tc-a-to-b-best-placement-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#tc-a-to-b-best-placement-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="tc-a-to-b-best-placement-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="tc-a-to-b-best-placement-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="tc-a-to-b-best-placement-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
          <marker id="tc-a-to-b-best-placement-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2d3142"/>
          </marker>
        </defs>

        <!-- Canvas background -->
        <rect x="0" y="0" width="1280" height="720" fill="#f5f5f5"/>

        <!-- Top header inside SVG for standalone SVG export clarity -->
        <text x="52" y="48" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">A → B UNIDIRECTIONAL IMPAIRMENT PLACEMENT</text>
        <text x="52" y="80" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">发送方向：A → B（出口限速串行化，接收端入口重定向后注入传播时延与丢包）</text>

        <!-- Host zones (drawn before connectors and nodes) -->
        <!-- Zone 1: Sender Host A -->
        <rect x="52" y="236" width="436" height="220" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.14"/>
        <rect x="68" y="244" width="136" height="20" rx="2" fill="#f5f5f5"/>
        <text x="136" y="259" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">发送端 Host A</text>

        <!-- Zone 2: Receiver Host B -->
        <rect x="572" y="236" width="656" height="220" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.14"/>
        <rect x="588" y="244" width="136" height="20" rx="2" fill="#f5f5f5"/>
        <text x="656" y="259" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">接收端 Host B</text>

        <!-- Connectors (drawn before all node boxes) -->
        <!-- Primary A -> B transmission flow at y=348 -->
        <line x1="244" y1="348" x2="296" y2="348" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#tc-a-to-b-best-placement-arrow)"/>
        <line x1="472" y1="348" x2="588" y2="348" stroke="#2e5aa8" stroke-width="2" marker-end="url(#tc-a-to-b-best-placement-arrow-link)"/>
        <line x1="724" y1="348" x2="764" y2="348" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#tc-a-to-b-best-placement-arrow)"/>
        <line x1="1028" y1="348" x2="1072" y2="348" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#tc-a-to-b-best-placement-arrow)"/>

        <!-- Pointer arrows from top optimal-point badges straight down to optimal enforcement points -->
        <!-- Pointer 1: BW -> A eth0 Egress (x=384) -->
        <line x1="384" y1="196" x2="384" y2="288" stroke="#2d3142" stroke-width="1.8" marker-end="url(#tc-a-to-b-best-placement-arrow-ink)"/>
        <!-- Pointer 2: LATENCY -> B ifb0 NetEm left symmetric attach point (x=808) -->
        <line x1="808" y1="196" x2="808" y2="288" stroke="#2d3142" stroke-width="1.8" marker-end="url(#tc-a-to-b-best-placement-arrow-ink)"/>
        <!-- Pointer 3: LOSS -> B ifb0 NetEm right symmetric attach point (x=984) -->
        <line x1="984" y1="196" x2="984" y2="288" stroke="#2d3142" stroke-width="1.8" marker-end="url(#tc-a-to-b-best-placement-arrow-ink)"/>

        <!-- Return ACK / congestion feedback path (orthogonal r=8 elbows) -->
        <path d="M 1140,408 V 524 Q 1140,532 1132,532 H 168 Q 160,532 160,524 V 408"
              fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#tc-a-to-b-best-placement-arrow)"/>

        <!-- Connector labels (opaque paper mask + >=8px visible gap from stroke, clear of all nodes) -->
        <!-- Label on A -> B link segment (x=472..588, midpoint 530; stroke at y=348, mask bottom at y=340 -> 8px gap) -->
        <rect x="480" y="300" width="100" height="40" rx="2" fill="#f5f5f5"/>
        <text x="530" y="317" fill="#2e5aa8" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">发送方向</text>
        <text x="530" y="335" fill="#2e5aa8" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">A → B DATA</text>

        <!-- Label on B -> A return ACK path (stroke at y=532, mask bottom at y=524 -> 8px gap) -->
        <rect x="420" y="500" width="440" height="24" rx="2" fill="#f5f5f5"/>
        <text x="640" y="517" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">B → A 反向 ACK / SACK（驱动 BBR BtlBw·RTprop 与 CUBIC cwnd）</text>

        <!-- Top Pointer Badges (3 boxes indicating optimal points) -->
        <!-- Badge 1: BW optimal point -->
        <rect x="292" y="120" width="184" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="292" y="120" width="184" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="300" y="128" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="322" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RATE</text>
        <text x="384" y="160" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">bw 最佳配置点</text>
        <text x="384" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">A eth0 egress (tbf)</text>

        <!-- Badge 2: LATENCY optimal point -->
        <rect x="728" y="120" width="160" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="728" y="120" width="160" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="736" y="128" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="762" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DELAY</text>
        <text x="808" y="160" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">latency 最佳配置点</text>
        <text x="808" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">B ifb0 (netem delay)</text>

        <!-- Badge 3: LOSS optimal point -->
        <rect x="904" y="120" width="160" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="904" y="120" width="160" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="912" y="128" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="934" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LOSS</text>
        <text x="984" y="160" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">loss 最佳配置点</text>
        <text x="984" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">B ifb0 (netem loss)</text>

        <!-- Pipeline Nodes (5 boxes along y=288..408, height=120) -->
        <!-- Node 1: Sender A Stack -->
        <rect x="76" y="288" width="168" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="76" y="288" width="168" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="84" y="296" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="108" y="305" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SENDER</text>
        <text x="160" y="340" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">A 传输层与应用</text>
        <text x="160" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">BBR / CUBIC / QUIC</text>
        <text x="160" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TSQ · Pacing</text>

        <!-- Node 2 (FOCAL 1): A eth0 Egress TBF -->
        <rect x="296" y="288" width="176" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="288" width="176" height="120" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.4" fill-opacity="0.08"/>
        <rect x="304" y="296" width="52" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="330" y="305" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EGRESS</text>
        <text x="384" y="340" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">A eth0 出口队列</text>
        <text x="384" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tbf rate · burst</text>
        <text x="384" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">bottleneck queue</text>

        <!-- Node 3: B eth0 Ingress Redirect -->
        <rect x="588" y="288" width="136" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="588" y="288" width="136" height="120" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="596" y="296" width="56" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="624" y="305" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">INGRESS</text>
        <text x="656" y="340" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">B eth0 入口</text>
        <text x="656" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">u32 / flower</text>
        <text x="656" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">mirred → ifb0</text>

        <!-- Node 4 (FOCAL 2): B ifb0 NetEm -->
        <rect x="764" y="288" width="264" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="764" y="288" width="264" height="120" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.4" fill-opacity="0.08"/>
        <rect x="772" y="296" width="44" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="794" y="305" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">IFB0</text>
        <text x="896" y="340" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">B ifb0 损伤队列</text>
        <text x="896" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">netem delay · jitter</text>
        <text x="896" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">loss state · limit(pkts)</text>

        <!-- Node 5: Receiver B Stack -->
        <rect x="1072" y="288" width="136" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="1072" y="288" width="136" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="1080" y="296" width="60" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="1110" y="305" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RECEIVER</text>
        <text x="1140" y="340" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">B 协议栈与应用</text>
        <text x="1140" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IP / TCP / QUIC</text>
        <text x="1140" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ACK Generation</text>

        <!-- Bottom Legend Strip (y=632..700) -->
        <line x1="52" y1="632" x2="1228" y2="632" stroke="#2d3142" stroke-width="1" stroke-opacity="0.14"/>
        <text x="52" y="656" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">LEGEND</text>

        <rect x="132" y="644" width="20" height="16" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1.4" fill-opacity="0.08"/>
        <text x="160" y="657" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">最佳 tc 执行点（A 出口 TBF / B ifb0 NetEm）</text>

        <line x1="468" y1="652" x2="508" y2="652" stroke="#2d3142" stroke-width="1.8" marker-end="url(#tc-a-to-b-best-placement-arrow-ink)"/>
        <text x="520" y="657" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">指向最佳配置点位</text>

        <line x1="668" y1="652" x2="708" y2="652" stroke="#2e5aa8" stroke-width="2" marker-end="url(#tc-a-to-b-best-placement-arrow-link)"/>
        <text x="720" y="657" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">A → B 发送方向</text>

        <line x1="860" y1="652" x2="900" y2="652" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#tc-a-to-b-best-placement-arrow)"/>
        <text x="912" y="657" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">B → A 反向 ACK 反馈（反向损伤按需镜像配置）</text>
      </svg>
