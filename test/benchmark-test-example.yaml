# mp_benchmark.py must be present in each node rootfs at /usr/bin/mp_benchmark.py.
host:
  image:
    name: default
    presets: predefined.node_config.yaml
  init_script: init_node.sh

tests:
  http_latency:
    description: "HTTP latency"
    topology:
      config_name: h0h1-multi-homing
      config_file: predefined.topology.yaml
    target_protocols: [http]
    route: static_route
    build_mode: rebuild
    test_tools:
      benchmark:
        profile: http_latency
        client_host: 0
        server_host: 1
  http_goodput:
    description: "HTTP goodput"
    topology:
      config_name: h0h1-multi-homing
      config_file: predefined.topology.yaml
    target_protocols: [http]
    route: static_route
    build_mode: rebuild
    test_tools:
      benchmark:
        profile: http_gooudput
        client_host: 0
        server_host: 1
