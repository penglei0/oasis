events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        root /usr/share/nginx/html;
        autoindex off;
        server_tokens off;

        # The report is file-based. Do not expose directory URLs or listings.
        location = / {
            try_files /index.html =404;
        }

        location ~ /$ {
            return 404;
        }

        # Raw benchmark logs are only exposed through generated HTML viewers.
        location ~* \.log$ {
            return 404;
        }

        # Do not serve hidden files or deployment metadata.
        location ~ /\. {
            return 404;
        }

        location = /visitor-count {
            proxy_pass http://127.0.0.1:9992;
            proxy_set_header Host $host;
            add_header Cache-Control no-store;
        }

        location / {
            try_files $uri =404;
        }
    }
}
